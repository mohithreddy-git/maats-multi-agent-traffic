<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs><style>.title{font:700 34px Arial;fill:#0f172a}.h{font:700 21px Arial;fill:#0f172a}.t{font:17px Arial;fill:#475569}.s{font:14px Arial;fill:#64748b}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="700" fill="#f8fafc"/><text x="55" y="56" class="title">Vehicle Detection &amp; Tracking Pipeline</text>
<g stroke-width="2"><rect x="55" y="110" width="220" height="120" rx="18" fill="#eff6ff" stroke="#60a5fa"/><rect x="325" y="110" width="220" height="120" rx="18" fill="#ecfdf5" stroke="#34d399"/><rect x="595" y="110" width="220" height="120" rx="18" fill="#f5f3ff" stroke="#8b5cf6"/><rect x="865" y="110" width="280" height="120" rx="18" fill="#fff7ed" stroke="#fb923c"/></g>
<g class="h"><text x="165" y="150" text-anchor="middle">1. Video Frame</text><text x="435" y="150" text-anchor="middle">2. YOLOv8n</text><text x="705" y="150" text-anchor="middle">3. ROI Filter</text><text x="1005" y="150" text-anchor="middle">4. Multi-Object Tracker</text></g><g class="t"><text x="165" y="182" text-anchor="middle">preserve aspect ratio</text><text x="435" y="182" text-anchor="middle">traffic classes</text><text x="705" y="182" text-anchor="middle">normalized geometry</text><text x="1005" y="182" text-anchor="middle">stable IDs + coasting</text></g><g class="s"><text x="165" y="207" text-anchor="middle">any supported size</text><text x="435" y="207" text-anchor="middle">confidence + IoU</text><text x="705" y="207" text-anchor="middle">camera-aware regions</text><text x="1005" y="207" text-anchor="middle">track-level class smoothing</text></g>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M275 170H325"/><path d="M545 170H595"/><path d="M815 170H865"/></g>
<rect x="145" y="315" width="910" height="180" rx="22" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="600" y="355" text-anchor="middle" class="h">Tracked Vehicle State</text><text x="600" y="394" text-anchor="middle" class="t">Bounding box • class • confidence • track ID • active state</text><text x="600" y="430" text-anchor="middle" class="t">Temporary detector misses are tolerated by tracking.</text><text x="600" y="465" text-anchor="middle" class="s">Stale tracks expire; video switches reset only video-specific tracking state.</text>
<rect x="90" y="555" width="1020" height="85" rx="18" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/><text x="600" y="590" text-anchor="middle" class="h">TrafficMetrics</text><text x="600" y="618" text-anchor="middle" class="s">active vehicles • unique vehicles • queue • density • arrival rate • latency • tracker FPS</text>
