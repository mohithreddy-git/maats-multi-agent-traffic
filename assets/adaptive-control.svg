<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
<defs><style>.title{font:700 34px Arial;fill:#0f172a}.h{font:700 21px Arial;fill:#0f172a}.t{font:17px Arial;fill:#475569}.s{font:14px Arial;fill:#64748b}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="680" fill="#f8fafc"/><text x="55" y="56" class="title">Adaptive Green-Time Control</text>
<g stroke-width="2"><rect x="55" y="105" width="275" height="130" rx="18" fill="#eff6ff" stroke="#60a5fa"/><rect x="390" y="105" width="380" height="130" rx="18" fill="#f5f3ff" stroke="#8b5cf6"/><rect x="830" y="105" width="315" height="130" rx="18" fill="#ecfdf5" stroke="#34d399"/></g>
<text x="192" y="145" text-anchor="middle" class="h">Traffic Inputs</text><text x="192" y="177" text-anchor="middle" class="t">vehicle count • queue • density</text><text x="192" y="205" text-anchor="middle" class="s">arrival / waiting when available</text>
<text x="580" y="145" text-anchor="middle" class="h">Green-Time Calculation</text><text x="580" y="177" text-anchor="middle" class="t">deterministic scoring + clamp</text><text x="580" y="205" text-anchor="middle" class="s">MIN = 10s • MAX = 90s</text>
<text x="988" y="145" text-anchor="middle" class="h">One Active Direction</text><text x="988" y="177" text-anchor="middle" class="t">exactly one GREEN</text><text x="988" y="205" text-anchor="middle" class="s">other three are RED</text>
<g stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M330 170H390"/><path d="M770 170H830"/></g>
<rect x="100" y="310" width="1000" height="150" rx="22" fill="#0f172a"/><text x="600" y="350" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#f8fafc">Traffic-adaptive examples</text><text x="600" y="392" text-anchor="middle" font-family="Arial" font-size="20" fill="#a7f3d0">Low traffic → shorter green</text><text x="600" y="422" text-anchor="middle" font-family="Arial" font-size="20" fill="#93c5fd">Medium traffic → medium green</text><text x="600" y="452" text-anchor="middle" font-family="Arial" font-size="20" fill="#fcd34d">Heavy / extreme traffic → longer green, capped at 90s</text>
<rect x="100" y="510" width="1000" height="105" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/><text x="600" y="548" text-anchor="middle" class="h">Phase stability</text><text x="600" y="578" text-anchor="middle" class="t">Duration is calculated once when the new GREEN phase begins.</text><text x="600" y="603" text-anchor="middle" class="s">New detections influence the next phase — the current countdown is not randomly reset.</text>
</svg>
