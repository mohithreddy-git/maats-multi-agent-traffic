<text x="220" y="165" text-anchor="middle" class="h">01 · Traffic Vision</text><rect x="90" y="195" width="260" height="145" rx="14" fill="#0f172a"/><path d="M220 210V328M105 268H335" stroke="#334155" stroke-width="24"/><rect x="160" y="240" width="58" height="33" rx="5" fill="none" stroke="#60a5fa" stroke-width="3"/><rect x="245" y="284" width="58" height="33" rx="5" fill="none" stroke="#34d399" stroke-width="3"/><text x="220" y="380" text-anchor="middle" class="t">boxes + IDs + confidence</text><text x="220" y="412" text-anchor="middle" class="s">real vehicle counts from tracks</text><text x="220" y="440" text-anchor="middle" class="s">upload + runtime switching</text>
<text x="600" y="165" text-anchor="middle" class="h">02 · Multi-Agent</text><circle cx="510" cy="245" r="34" fill="#e0f2fe" stroke="#38bdf8"/><circle cx="690" cy="245" r="34" fill="#e0f2fe" stroke="#38bdf8"/><circle cx="510" cy="335" r="34" fill="#e0f2fe" stroke="#38bdf8"/><circle cx="690" cy="335" r="34" fill="#e0f2fe" stroke="#38bdf8"/><text x="510" y="252" text-anchor="middle" class="h">N</text><text x="690" y="252" text-anchor="middle" class="h">E</text><text x="510" y="342" text-anchor="middle" class="h">S</text><text x="690" y="342" text-anchor="middle" class="h">W</text><rect x="555" y="250" width="90" height="80" rx="14" fill="#fff" stroke="#8b5cf6"/><text x="600" y="278" text-anchor="middle" class="s">COORDINATOR</text><text x="600" y="302" text-anchor="middle" class="s">next dir.</text><text x="600" y="322" text-anchor="middle" class="s">+ duration</text><text x="600" y="392" text-anchor="middle" class="t">real metrics → messages → decision</text><text x="600" y="424" text-anchor="middle" class="s">no fabricated traffic values</text>
