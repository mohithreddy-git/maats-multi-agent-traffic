<defs><style>.title{font:700 34px Arial;fill:#0f172a}.h{font:700 21px Arial;fill:#0f172a}.t{font:17px Arial;fill:#475569}.s{font:14px Arial;fill:#64748b}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="#64748b"/></marker></defs><rect width="1200" height="560" fill="#f8fafc"/><text x="55" y="56" class="title">Evaluator Demo Flow</text>
